<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyPodLM</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="Your AI-powered knowledge companion" />

    <meta property="og:title" content="StudyPodLM" />
    <meta
      property="og:description"
      content="Your AI-powered knowledge companion"
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const resolved = stored === 'dark'
            ? 'dark'
            : stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved);
        } catch {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Google Fonts - Space Grotesk + Source Sans Pro (from fontpair.co) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
